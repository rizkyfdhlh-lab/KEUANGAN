<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<meta name="theme-color" content="#0f9d8a">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<title>Keuangan</title>
<style>
:root{--t:#0f9d8a;--t2:#dcf4ef;--ink:#12302c;--mut:#6b8581;--red:#d94f4f;--line:#e3efec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(900px 420px at 100% -10%,#d7f3ec,transparent 60%),radial-gradient(700px 420px at -10% 35%,#e6f7e6,transparent 55%),#fff}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 14px;letter-spacing:-.02em}h2{font-size:15px;margin:18px 0 8px}
.card{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(15,157,138,.15);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 6px 24px rgba(15,157,138,.07)}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.in{color:#0b8a63}.out{color:var(--red)}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9);color:var(--ink)}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--t);color:#fff;font-weight:600}
button:disabled{opacity:.6}button.g{background:var(--t2);color:var(--t)}button.d{background:#fdeaea;color:var(--red)}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.seg{display:flex;background:var(--t2);border-radius:14px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;background:transparent;color:var(--t);padding:9px 10px;white-space:nowrap;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(15,157,138,.18)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;gap:4px;padding:6px;border-radius:26px;
background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(15,157,138,.18);box-shadow:0 8px 30px rgba(15,157,138,.14)}
nav button{flex:1;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:7px 0;border-radius:20px}
nav button.on{color:var(--t);background:var(--t2)}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}
.donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars i{flex:1;background:var(--t);border-radius:6px 6px 2px 2px;min-height:3px}
.bl{display:flex;gap:4px;font-size:10px;color:var(--mut)}.bl span{flex:1;text-align:center}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--t2);color:var(--t);padding:5px 5px 5px 12px;border-radius:99px;margin:3px 4px 3px 0;font-size:14px}
.chip b{width:24px;height:24px;display:grid;place-items:center;background:#fff;border-radius:50%}
.ins p{margin:6px 0}.empty{text-align:center;color:var(--mut);padding:18px 0}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;transition:transform .25s;z-index:9;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--red)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body>
<main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const LS=(()=>{try{return localStorage}catch(e){return{}}})();
let S={url:LS.u||'',pin:LS.p||'',nama:LS.n||''};
let D;try{D=JSON.parse(LS.d)}catch(e){}
D=D||{in:[],out:[],kat:{in:[],out:[]},dom:[]};
let V=S.url&&S.pin&&S.nama?'home':'set',WHO='me',F='month',C={a:'',b:''},TP='out',ED=null,QS='',LAST={},CH=Promise.resolve();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=l=>l.reduce((s,x)=>s+x.jml,0);
const COL=['#0f9d8a','#5bc0a8','#a3d977','#f2c14e','#f08a5d','#7aa6e0','#b48ad8','#e07a9b','#8aa39f'];
const fd=t=>new Date(t+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});

function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
async function api(q){
  const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...q,pin:S.pin})});
  const j=await r.json();if(!j.ok)throw new Error(j.err);
  D=j.data;try{LS.d=JSON.stringify(D)}catch(e){}
}
function run(q,msg){
  const p=CH.then(async()=>{try{await api(q);if(msg)toast(msg);return true}
    catch(e){toast(e instanceof TypeError?'Tidak ada koneksi atau URL API salah':e.message,1);return false}});
  CH=p;return p;
}
function rng(){
  const t=today();let a=t,b=t;const d=new Date(t+'T00:00:00');
  if(F==='week'){d.setDate(d.getDate()-(d.getDay()+6)%7);a=iso(d)}
  else if(F==='month')a=t.slice(0,8)+'01';
  else if(F==='custom'){a=C.a||t.slice(0,8)+'01';b=C.b||t}
  return a>b?[b,a]:[a,b];
}
const inR=(x,a,b)=>x.tgl>=a&&x.tgl<=b;
const mine=l=>l.filter(x=>WHO=='all'||(WHO=='me'?x.own===S.nama:x.own===WHO));
const owners=()=>[...new Set([...D.in,...D.out].map(x=>x.own).filter(o=>o&&o!==S.nama))];
const whoBar=()=>`<div class="seg">${[['me',S.nama||'Saya'],...owners().map(n=>[n,n]),['all','Semua']].map(([k,l])=>`<button data-w="${esc(k)}" class="${WHO==k?'on':''}">${esc(l)}</button>`).join('')}</div><div style="height:8px"></div>`;

function home(){
  const[a,b]=rng(),I=mine(D.in).filter(x=>inR(x,a,b)),O=mine(D.out).filter(x=>inR(x,a,b)),ti=sum(I),to=sum(O);
  const days=Math.round((new Date(b)-new Date(a))/864e5)+1;
  const pb=new Date(a+'T00:00:00');pb.setDate(pb.getDate()-1);const pa=new Date(pb);pa.setDate(pa.getDate()-days+1);
  const po=sum(mine(D.out).filter(x=>inR(x,iso(pa),iso(pb))));
  const bk={};O.forEach(x=>bk[x.kat]=(bk[x.kat]||0)+x.jml);
  const cats=Object.entries(bk).sort((p,q)=>q[1]-p[1]);
  let acc=0;const stops=cats.map(([k,v],i)=>{const s=acc/to*100;acc+=v;return COL[Math.min(i,COL.length-1)]+' '+s+'% '+acc/to*100+'%'}).join(',');
  const n=Math.min(days,14),e=new Date(b+'T00:00:00'),bd=[];
  for(let i=n-1;i>=0;i--){const d=new Date(e);d.setDate(e.getDate()-i);const k=iso(d);bd.push([k,sum(O.filter(x=>x.tgl===k))])}
  const mx=Math.max(1,...bd.map(x=>x[1]));
  const wal=D.dom.map(w=>[w,sum(mine(D.in).filter(x=>x.dom===w))-sum(mine(D.out).filter(x=>x.dom===w))]);
  const ins=[];
  if(cats.length)ins.push(`Pengeluaran terbesar: <b>${esc(cats[0][0])}</b> (${Math.round(cats[0][1]/to*100)}% dari total).`);
  if(to)ins.push(`Rata-rata pengeluaran ${rp(to/days)} per hari.`);
  if(po&&to)ins.push(`Pengeluaran ${to>po?'naik':'turun'} ${Math.abs(Math.round((to-po)/po*100))}% dibanding periode sebelumnya.`);
  if(ti&&to)ins.push(ti>=to?`Anda menyisihkan ${Math.round((ti-to)/ti*100)}% dari pemasukan.`:'Pengeluaran melebihi pemasukan pada periode ini.');
  const none=!D.in.length&&!D.out.length;
  return `<h1>Keuangan</h1>${whoBar()}
  <div class="seg">${[['day','Hari ini'],['week','Minggu ini'],['month','Bulan ini'],['custom','Kustom']].map(([k,l])=>`<button data-f="${k}" class="${F==k?'on':''}">${l}</button>`).join('')}</div>
  ${F=='custom'?`<div class="row" style="margin-top:8px"><input type="date" id="ca" value="${a}"><input type="date" id="cb" value="${b}"></div>`:''}
  <div class="card" style="margin-top:12px"><div class="mut">Selisih periode</div><div class="big ${ti>=to?'in':'out'}">${rp(ti-to)}</div>
    <div class="row sp" style="margin-top:10px"><div><div class="mut">Pemasukan</div><b class="in">${rp(ti)}</b></div>
    <div style="text-align:right"><div class="mut">Pengeluaran</div><b class="out">${rp(to)}</b></div></div></div>
  ${none?'<div class="empty">Belum ada transaksi.<br>Ketuk <b>Catat</b> untuk mencatat yang pertama.</div>':''}
  ${wal.length?`<h2>Saldo dompet</h2><div class="card">${wal.map(([w,s])=>`<div class="row sp" style="padding:5px 0"><span>${esc(w)}</span><b class="${s<0?'out':''}">${rp(s)}</b></div>`).join('')}</div>`:''}
  ${to?`<h2>Pengeluaran per kategori</h2><div class="card row"><div class="donut" style="background:conic-gradient(${stops})"></div>
    <div style="flex:1;min-width:0">${cats.slice(0,6).map(([k,v],i)=>`<div class="row sp" style="font-size:14px;padding:2px 0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="dot" style="background:${COL[i]}"></i>${esc(k)}</span><span class="mut">${Math.round(v/to*100)}%</span></div>`).join('')}</div></div>
    <h2>Pengeluaran harian</h2><div class="card"><div class="bars">${bd.map(([k,v])=>`<i title="${fd(k)}: ${rp(v)}" style="height:${v/mx*100}%"></i>`).join('')}</div><div class="bl">${bd.map(([k])=>`<span>${+k.slice(8)}</span>`).join('')}</div></div>`:''}
  ${ins.length?`<h2>Insight</h2><div class="card ins">${ins.map(i=>`<p>${i}</p>`).join('')}</div>`:''}`;
}

function form(){
  const ex=ED?D[ED.t].find(x=>x.id===ED.id):null;if(ED&&!ex)ED=null;
  const t=ED?ED.t:TP,v=ex||{};
  const opt=(l,sel)=>l.map(k=>`<option ${k==sel?'selected':''}>${esc(k)}</option>`).join('');
  return `<h1>${ED?'Ubah transaksi':'Catat transaksi'}</h1>
  ${ED?'':`<div class="seg"><button data-tp="out" class="${t=='out'?'on':''}">Pengeluaran</button><button data-tp="in" class="${t=='in'?'on':''}">Pemasukan</button></div>`}
  <div class="card" style="margin-top:12px">
    <label>Jumlah (Rp)</label><input id="jml" inputmode="numeric" autocomplete="off" placeholder="0" value="${v.jml?v.jml.toLocaleString('id-ID'):''}" style="font-size:28px;font-weight:700">
    <label>Kategori</label><select id="kat">${opt(D.kat[t]||[],v.kat||LAST[t+'k'])}</select>
    <label>Dompet</label><select id="dom">${opt(D.dom,v.dom||LAST[t+'d'])}</select>
    <label>Tanggal</label><input type="date" id="tgl" value="${v.tgl||today()}">
    <label>Catatan (opsional)</label><input id="cat" maxlength="120" value="${esc(v.cat||'')}">
  </div>
  <button id="save" style="width:100%">${ED?'Simpan perubahan':'Simpan'}</button>
  ${ED?`<div class="row" style="margin-top:8px"><button class="g" id="cancel" style="flex:1">Batal</button><button class="d" id="del" style="flex:1">Hapus</button></div>`:''}`;
}
async function save(){
  const t=ED?ED.t:TP,jml=+$('#jml').value.replace(/\D/g,''),kat=$('#kat').value,dom=$('#dom').value,tgl=$('#tgl').value,cat=$('#cat').value.trim();
  if(!jml)return toast('Isi jumlah lebih dari 0',1);
  if(!kat)return toast('Belum ada kategori. Tambahkan di Atur.',1);
  if(!dom)return toast('Belum ada dompet. Tambahkan di Atur.',1);
  if(!tgl)return toast('Pilih tanggal',1);
  const wasEdit=!!ED,btn=$('#save');btn.disabled=true;btn.textContent='Menyimpan…';
  const ok=await run(wasEdit?{a:'upd',t,id:ED.id,tgl,jml,kat,dom,cat,own:S.nama}:{a:'add',t,tgl,jml,kat,dom,cat,own:S.nama},wasEdit?'Perubahan tersimpan':'Transaksi tersimpan');
  if(ok){LAST[t+'k']=kat;LAST[t+'d']=dom;if(wasEdit){ED=null;V='hist'}}
  render();if(ok&&!wasEdit)$('#jml')&&$('#jml').focus();
}
async function del(){
  if(!confirm('Hapus transaksi ini? Tindakan ini tidak bisa dibatalkan.'))return;
  if(await run({a:'del',t:ED.t,id:ED.id,own:S.nama},'Transaksi dihapus')){ED=null;V='hist'}
  render();
}

function items(){
  const q=QS.toLowerCase();
  const L=[...mine(D.out).map(x=>({...x,t:'out'})),...mine(D.in).map(x=>({...x,t:'in'}))]
    .filter(x=>!q||[x.kat,x.cat,x.dom,x.jml,x.tgl,fd(x.tgl),x.own].join(' ').toLowerCase().includes(q))
    .sort((p,r)=>r.tgl.localeCompare(p.tgl)).slice(0,200);
  if(!L.length)return `<div class="empty">${q?'Tidak ada transaksi yang cocok.':'Belum ada transaksi.'}</div>`;
  return L.map(x=>`<div class="it" data-id="${esc(x.id)}" data-t="${x.t}" data-own="${esc(x.own||'')}"><div style="min-width:0"><b>${esc(x.kat)}</b>
    <div class="mut">${fd(x.tgl)} · ${esc(x.dom)}${x.cat?' · '+esc(x.cat):''}${WHO=='all'&&x.own?' · '+esc(x.own):''}</div></div>
    <b class="${x.t}" style="white-space:nowrap">${x.t=='in'?'+':'-'}${rp(x.jml)}</b></div>`).join('');
}
const hist=()=>`<h1>Riwayat</h1>${whoBar()}<input id="q" type="search" placeholder="Cari kategori, catatan, dompet…" value="${esc(QS)}"><div class="card" id="list" style="margin-top:12px">${items()}</div>`;

function setv(){
  const chips=(arr,a,tp)=>arr.map(n=>`<span class="chip">${esc(n)}<b data-x="${a}" data-tipe="${tp||''}" data-n="${esc(n)}" role="button" aria-label="Hapus ${esc(n)}">×</b></span>`).join('')||'<span class="mut">Belum ada</span>';
  const add=(a,tp,ph)=>`<div class="row" style="margin-top:8px"><input id="n-${a}${tp?'-'+tp:''}" placeholder="${ph}"><button class="g" data-add="${a}" data-tipe="${tp||''}">Tambah</button></div>`;
  return `<h1>Pengaturan</h1>
  <div class="card"><b>Koneksi</b><label>Nama saya (mis. Rizky)</label><input id="nama" maxlength="20" value="${esc(S.nama)}"><label>URL API (Apps Script)</label><input id="url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off">
    <label>PIN</label><input id="pin" type="password" inputmode="numeric" value="${esc(S.pin)}"><button id="conn" style="width:100%;margin-top:12px">Simpan dan sinkronkan</button></div>
  <div class="card"><b>Kategori pengeluaran</b><div>${chips(D.kat.out,'kat','out')}</div>${add('kat','out','Kategori baru')}</div>
  <div class="card"><b>Kategori pemasukan</b><div>${chips(D.kat.in,'kat','in')}</div>${add('kat','in','Kategori baru')}</div>
  <div class="card"><b>Dompet</b><div>${chips(D.dom,'dom')}</div>${add('dom','','Dompet baru, mis. BCA')}</div>`;
}

function render(){
  $('#app').innerHTML=({home,add:form,hist,set:setv})[V]();
  $('#nav').innerHTML=[['home','◐','Beranda'],['add','＋','Catat'],['hist','☰','Riwayat'],['set','⚙','Atur']]
    .map(([k,i,l])=>`<button data-v="${k}" class="${V==k?'on':''}"><span style="font-size:20px;line-height:1.1">${i}</span>${l}</button>`).join('');
  const j=$('#jml');if(j)j.oninput=e=>{const n=e.target.value.replace(/\D/g,'');e.target.value=n?(+n).toLocaleString('id-ID'):''};
  const q=$('#q');if(q)q.oninput=e=>{QS=e.target.value;$('#list').innerHTML=items()};
  ['ca','cb'].forEach(id=>{const el=$('#'+id);if(el)el.onchange=()=>{C={a:$('#ca').value,b:$('#cb').value};render()}});
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('button,[data-id],[data-x]');if(!el)return;const d=el.dataset;
  if(d.v){V=d.v;ED=null;render()}
  else if(d.f){F=d.f;render()}
  else if(d.tp){TP=d.tp;render()}
  else if(el.id=='save')save();
  else if(el.id=='del')del();
  else if(el.id=='cancel'){ED=null;V='hist';render()}
  else if(d.w){WHO=d.w;render()}
  else if(d.id){if(d.own&&d.own!==S.nama)return toast('Dicatat oleh '+d.own+'. Hanya pencatatnya yang bisa mengubah.',1);ED={t:d.t,id:d.id};V='add';render()}
  else if(el.id=='conn'){
    S.url=$('#url').value.trim();S.pin=$('#pin').value.trim();S.nama=$('#nama').value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(S.url)||!S.pin||!S.nama)return toast('Isi nama, URL API (diawali https://script.google.com/), dan PIN',1);
    try{LS.u=S.url;LS.p=S.pin;LS.n=S.nama}catch(x){}
    el.disabled=true;el.textContent='Menyinkronkan…';
    if(await run({a:'all'},'Terhubung ke Google Sheets'))V='home';render();
  }
  else if(d.add){
    const inp=$('#n-'+d.add+(d.tipe?'-'+d.tipe:'')),nama=inp.value.trim();if(!nama)return toast('Isi nama dulu',1);
    await run({a:d.add,op:'add',tipe:d.tipe,nama},'Ditambahkan');render();
  }
  else if(d.x){
    if(!confirm(`Hapus "${d.n}"? Transaksi lama tetap tersimpan.`))return;
    await run({a:d.x,op:'del',tipe:d.tipe,nama:d.n},'Dihapus');render();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.url&&S.pin&&['home','hist'].includes(V))run({a:'all'}).then(render)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(S.url&&S.pin)run({a:'all'}).then(()=>{if(!ED&&V!='set')render()});
</script></body></html>
